<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Spotlight Page</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100vh;
      background-color: #000000;
      color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      touch-action: none;
    }

    /* Fixed Smooth Spotlight Pointer (#42068c) */
    .spotlight {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 1;
      will-change: background;
      background: radial-gradient(
        600px circle at var(--x, 50%) var(--y, 50%), 
        rgba(66, 6, 140, 0.5), 
        transparent 40%
      );
    }

    /* Hardware-Accelerated Container for Smooth Swipe-Up */
    .swipe-container {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 85%;
      max-width: 1200px;
      user-select: none;
      will-change: transform, opacity;
      animation: swipeUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.2s;
    }

    .content {
      text-align: center;
      margin-bottom: 20px;
    }

    .content h1 {
      font-size: 2.2rem;
      margin-bottom: 8px;
    }

    .content p {
      font-size: 1.1rem;
      opacity: 0.8;
    }

    .cutout-image {
      max-height: 35vh;
      max-width: 80vw;
      object-fit: contain;
      display: block;
      filter: drop-shadow(0 -10px 20px rgba(66, 6, 140, 0.4)); 
    }

    /* Desktop Responsive Layout */
    @media screen and (min-width: 600px) {
      .swipe-container {
        flex-direction: row !important;
        justify-content: space-between !important;
        align-items: center !important;
      }

      .content {
        text-align: left !important;
        margin-bottom: 0 !important;
        max-width: 450px !important;
      }

      .content h1 {
        font-size: 3.5rem;
      }

      .cutout-image {
        max-height: 60vh !important;
        max-width: 40vw !important;
      }
    }

    /* Optimized Hardware-Accelerated Animation */
    @keyframes swipeUp {
      0% {
        transform: translate3d(0, 50px, 0);
        opacity: 0;
      }
      100% {
        transform: translate3d(0, 0, 0);
        opacity: 1;
      }
    }
  </style>
</head>
<body>

  <!-- Pointer Spotlight Layer -->
  <div class="spotlight"></div>

  <!-- Landing Content -->
  <div class="swipe-container">
    <div class="content">
      <h1>Hover or Tap</h1>
      <p>nadfi</p>
    </div>

    <img 
      src="3d-render-of-lush-green-leaves-on-a-transparent-background-free-png (1).png" 
      alt="Cutout Photo" 
      class="cutout-image"
    >
  </div>

  <script>
    let mouseX = window.innerWidth / 2;
    let mouseY = window.innerHeight / 2;
    let isTicking = false;

    // Smooth Update Loop using requestAnimationFrame
    function updateLightPosition() {
      document.documentElement.style.setProperty('--x', `${mouseX}px`);
      document.documentElement.style.setProperty('--y', `${mouseY}px`);
      isTicking = false;
    }

    function requestUpdate(x, y) {
      mouseX = x;
      mouseY = y;
      if (!isTicking) {
        requestAnimationFrame(updateLightPosition);
        isTicking = true;
      }
    }

    // Desktop Mouse Event Listener
    window.addEventListener('mousemove', (e) => {
      requestUpdate(e.clientX, e.clientY);
    }, { passive: true });

    // Mobile/Tablet Touch Event Listeners
    window.addEventListener('touchstart', (e) => {
      if (e.touches.length > 0) {
        requestUpdate(e.touches[0].clientX, e.touches[0].clientY);
      }
    }, { passive: true });

    window.addEventListener('touchmove', (e) => {
      if (e.touches.length > 0) {
        requestUpdate(e.touches[0].clientX, e.touches[0].clientY);
      }
    }, { passive: true });
  </script>

</body>
</html>
