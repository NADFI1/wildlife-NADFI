<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NADFI</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100vh;
      background-color: #02000d;
      color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      touch-action: none;
    }

    /* Fixed Animated Gradient Border (Inset by 5px) */
    body::before {
      content: '';
      position: fixed;
      inset: 80px;
      border: 3px solid transparent;
      border-image: linear-gradient(
        45deg, 
        #18edea, 
        #42068c, 
        #18edea, 
        #42068c
      ) 1;
      animation: rotateGradient 6s linear infinite;
      pointer-events: none;
      z-index: 20;
    }

    @keyframes rotateGradient {
      0% { border-image-source: linear-gradient(0deg, #18edea, #42068c, #18edea, #42068c); }
      25% { border-image-source: linear-gradient(90deg, #18edea, #42068c, #18edea, #42068c); }
      50% { border-image-source: linear-gradient(180deg, #18edea, #42068c, #18edea, #42068c); }
      75% { border-image-source: linear-gradient(270deg, #18edea, #42068c, #18edea, #42068c); }
      100% { border-image-source: linear-gradient(360deg, #18edea, #42068c, #18edea, #42068c); }
    }

    /* Fixed Purple Spotlight Pointer (#42068c) */
    .spotlight {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 1;
      background: radial-gradient(
        100px circle at var(--x, 50%) var(--y, 50%), 
        rgba(66, 6, 140, 0.5), 
        transparent 40%
      );
    }

    /* Main Container with Swipe Up Animation */
    .swipe-container {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 85%;
      max-width: 1200px;
      user-select: none;
      animation: swipeUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.3s;
    }

    .content {
      text-align: center;
      margin-bottom: 20px;
    }

    .content h1 {
      font-size: 2.2rem;
      margin-bottom: 8px;
    }

    .content p {
      font-size: 1.1rem;
      opacity: 0.8;
    }

    .cutout-image {
      max-height: 35vh;
      max-width: 80vw;
      object-fit: contain;
      display: block;
      filter: drop-shadow(0 -10px 20px rgba(66, 6, 140, 0.4)); 
    }

    /* Responsive Desktop Layout (Left Text, Right Cutout Image) */
    @media screen and (min-width: 600px) {
      .swipe-container {
        flex-direction: row !important;
        justify-content: space-between !important;
        align-items: center !important;
      }

      .content {
        text-align: left !important;
        margin-bottom: 0 !important;
        max-width: 450px !important;
      }

      .content h1 {
        font-size: 3.5rem;
      }

      .cutout-image {
        max-height: 60vh !important;
        max-width: 40vw !important;
      }
    }

    /* Initial Entrance Keyframe */
    @keyframes swipeUp {
      0% {
        transform: translateY(50px);
        opacity: 0;
      }
      100% {
        transform: translateY(0);
        opacity: 1;
      }
    }
  </style>
</head>
<body>

  <!-- Pointer Spotlight Layer -->
  <div class="spotlight"></div>

  <!-- Landing Content -->
  <div class="swipe-container">
    <div class="content">
      <h1>Hover or Tap</h1>
      <p>nadfi</p>
    </div>

    <img 
      src="3d-render-of-lush-green-leaves-on-a-transparent-background-free-png (1).png" 
      alt="Cutout Photo" 
      class="cutout-image"
    >
  </div>

  <script>
    // Spotlight Pointer Movement
    function updateLightPosition(x, y) {
      document.documentElement.style.setProperty('--x', `${x}px`);
      document.documentElement.style.setProperty('--y', `${y}px`);
    }

    // Desktop Mouse Events
    window.addEventListener('mousemove', (e) => updateLightPosition(e.clientX, e.clientY));

    // Mobile/Tablet Touch Events
    window.addEventListener('touchstart', (e) => {
      if (e.touches.length > 0) updateLightPosition(e.touches[0].clientX, e.touches[0].clientY);
    });
    window.addEventListener('touchmove', (e) => {
      if (e.touches.length > 0) updateLightPosition(e.touches[0].clientX, e.touches[0].clientY);
    });
  </script>

</body>
</html>
