<!DOCTYPE html>
<html>
    <head>
        <title>NADFI</title>
<meta name="google-site-verification" content="3MzwCMmGiZSS0C-WJIWHXD79BrM9cNpIm0ShlMTTHw8" />
        <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Links your style.css file -->
  <link rel="stylesheet" href="style.html">
    
    <style>
        * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      background-color: #0b011c;
      color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      touch-action: none;
    }
        body::before {
      content: '';
      position: fixed;
      inset: 30px;
      border: 2px solid transparent; /* Border width */
      border-image: linear-gradient(
        45deg, 
        #18edea, 
        #42068c, 
        #18edea, 
        #42068c
      ) 1;
      animation: rotateGradient 15s linear infinite;
      pointer-events: none;
      z-index: 2;
    }

    /* Keyframes for smooth color shift along the border */
    @keyframes rotateGradient {
      0% {
        border-image-source: linear-gradient(0deg, #18edea, #42068c, #18edea);
      }
      25% {
        border-image-source: linear-gradient(90deg, #18edea, 
        #42068c, 
        #18edea, 
        #42068c);
      }
      50% {
        border-image-source: linear-gradient(180deg, #18edea, 
        #42068c, 
        #18edea, 
        #42068c);
      }
      75% {
        border-image-source: linear-gradient(270deg, #18edea, 
        #42068c, 
        #18edea, );
      }
      100% {
        border-image-source: linear-gradient(360deg, #18edea, 
        #42068c, 
        #18edea, 
        #42068c);
      }
    }

    .spotlight {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none; /* Allows clicks to pass through to elements underneath */
      background: radial-gradient(
        100px circle at var(--x, 50%) var(--y, 50%), 
        rgba(66, 6, 140, 0.5), 
        transparent 40%
      );
    }

    .content {
      text-align: center;
      z-index: 1;
    }
          .swipe-container {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%) translateY(100%);
      z-index: 3;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      text-align: center;
      pointer-events: none;
      user-select: none;
      animation: swipeUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.3s;
    }

    .content-text {
      margin-bottom: 20px;
    }

    .content-text h1 {
      font-size: 2.5rem;
      margin-bottom: 8px;
    }

    .content-text p {
      font-size: 1.1rem;
      opacity: 0.8;
    }

    .cutout-image {
      max-height: 50vh;
      max-width: 90vw;
      object-fit: contain;
      display: block;
      filter: drop-shadow(0 -10px 20px rgba(66, 6, 140, 0.4)); 
    }

    /* Swipe Up Keyframes for Entire Block */
    @keyframes swipeUp {
      0% {
        transform: translateX(-50%) translateY(100%);
        opacity: 0;
      }
      100% {
        transform: translateX(-50%) translateY(0%);
        opacity: 1;
      }
    }
        </style>
    </head>
<body>
    <div class="spotlight"></div>

<div class="swipe-container">
  <div class="content">
    <h1>Hover or Tap</h1>
    <p>nadfi</p>
  </div>

  <img 
    src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=600&q=80" 
    alt="Cutout Photo" 
    class="cutout-image"
  >
</div>

    <script>
    function updateLightPosition(x, y) {
      document.documentElement.style.setProperty('--x', `${x}px`);
      document.documentElement.style.setProperty('--y', `${y}px`);
    }
    window.addEventListener('mousemove', (e) => {
      updateLightPosition(e.clientX, e.clientY);
    });
    window.addEventListener('touchstart', (e) => {
      if (e.touches.length > 0) {
        updateLightPosition(e.touches[0].clientX, e.touches[0].clientY);
      }
    });

    window.addEventListener('touchmove', (e) => {
      if (e.touches.length > 0) {
        updateLightPosition(e.touches[0].clientX, e.touches[0].clientY);
      }
    });
        
    </script>
    </body>

    
</html>
