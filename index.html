<!DOCTYPE html>
<html>
    <head>
        <title>NADFI</title>
<meta name="google-site-verification" content="3MzwCMmGiZSS0C-WJIWHXD79BrM9cNpIm0ShlMTTHw8" />
        <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Links your style.css file -->
  <link rel="stylesheet" href="style.html">
    </head>
    <style>
        * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      background-color: #011c0e;
      color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .spotlight {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none; /* Allows clicks to pass through to elements underneath */
      background: radial-gradient(
        600px circle at var(--x, 50%) var(--y, 50%), 
        rgba(204, 169, 27, 0.35), 
        transparent 40%
      );
    }

    .content {
      text-align: center;
      z-index: 1;
    }
        </style>
<body>
    <div class="spotlight"></div>

  <div class="content">
    <p>nadfi</p>
  </div>
    <script>
    function updateLightPosition(x, y) {
      document.documentElement.style.setProperty('--x', `${x}px`);
      document.documentElement.style.setProperty('--y', `${y}px`);
    }
    window.addEventListener('mousemove', (e) => {
      updateLightPosition(e.clientX, e.clientY);
    });
    window.addEventListener('touchstart', (e) => {
      if (e.touches.length > 0) {
        updateLightPosition(e.touches[0].clientX, e.touches[0].clientY);
      }
    });

    window.addEventListener('touchmove', (e) => {
      if (e.touches.length > 0) {
        updateLightPosition(e.touches[0].clientX, e.touches[0].clientY);
      }
    });
    </script>
    </body>

    
</html>
