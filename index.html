<!DOCTYPE html>
<html>
    <head>
        <title>NADFI</title>
<meta name="google-site-verification" content="3MzwCMmGiZSS0C-WJIWHXD79BrM9cNpIm0ShlMTTHw8" />
        <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Links your style.css file -->
  <link rel="stylesheet" href="style.html">
    
    <style>
        * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      background-color: #0b011c;
      color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      touch-action: none;
    }
        body::before {
      content: '';
      position: fixed;
      inset: 30px;
      border: 4px solid transparent; /* Border width */
      border-image: linear-gradient(
        45deg, 
        #18edea, 
        #42068c, 
        #18edea, 
        #42068c
      ) 1;
      animation: rotateGradient 15s linear infinite;
      pointer-events: none;
      z-index: 2;
    }

    /* Keyframes for smooth color shift along the border */
    @keyframes rotateGradient {
      0% {
        border-image-source: linear-gradient(0deg, #18edea, #42068c, #18edea);
      }
      25% {
        border-image-source: linear-gradient(90deg, #18edea, 
        #42068c, 
        #18edea, 
        #42068c);
      }
      50% {
        border-image-source: linear-gradient(180deg, #18edea, 
        #42068c, 
        #18edea, 
        #42068c);
      }
      75% {
        border-image-source: linear-gradient(270deg, #18edea, 
        #42068c, 
        #18edea, );
      }
      100% {
        border-image-source: linear-gradient(360deg, #18edea, 
        #42068c, 
        #18edea, 
        #42068c);
      }
    }

    .spotlight {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none; /* Allows clicks to pass through to elements underneath */
      background: radial-gradient(
        100px circle at var(--x, 50%) var(--y, 50%), 
        rgba(66, 6, 140, 0.5), 
        transparent 40%
      );
    }

    .content {
      text-align: center;
      z-index: 1;
    }
        </style>
    </head>
<body>
    <div class="spotlight"></div>

  <div class="content">
    <p>nadfi</p>
  </div>
    <script>
    function updateLightPosition(x, y) {
      document.documentElement.style.setProperty('--x', `${x}px`);
      document.documentElement.style.setProperty('--y', `${y}px`);
    }
    window.addEventListener('mousemove', (e) => {
      updateLightPosition(e.clientX, e.clientY);
    });
    window.addEventListener('touchstart', (e) => {
      if (e.touches.length > 0) {
        updateLightPosition(e.touches[0].clientX, e.touches[0].clientY);
      }
    });

    window.addEventListener('touchmove', (e) => {
      if (e.touches.length > 0) {
        updateLightPosition(e.touches[0].clientX, e.touches[0].clientY);
      }
    });
    </script>
    </body>

    
</html>
