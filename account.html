  <!-- Mobile Slide-Out Side Drawer Menu -->
  <div class="side-nav">
    <label for="nav-toggle" class="close-btn">&times;</label>
    <a href="index.html">Home</a>
    <a href="about.html">About Us</a>
    <a href="account.html">Account</a>

    <a href="project1.html">Project 1</a>

  <!-- Mobile Background Overlay for Menu -->
  <label for="nav-toggle" class="sidebar-overlay"></label>

  <!-- Desktop Top Navigation Bar -->
  <nav class="desktop-nav">
    <a href="index.html">
      <img src="Logo.png" alt="NADFI Logo" class="site-logo">
    </a>
    <a href="index.html">Home</a>

    <a href="account.html">Account</a>
    <a href="decisions.html">Decisions</a>

    <a href="goals.html">Goals</a>
    <a href="project1.html">Project 1</a>

  <!-- Main Account Content -->
  <div class="content">
    <div class="photo-text">
      <img src="IMG-20260917-WA0003.jpg" alt="NADFI Photo" style="width: 100px; height: auto;">
      <h1 style="font-size: 250%;">NADFI</h1>
    </div>

    <h1>Protecting Nature, Life and Building Hopes.</h1>
    <p>Choose an account provider and enter your details.</p>

    <div class="account-actions">
      <button id="logout-button" type="button">Log out</button>
      <p class="logout-status" aria-live="polite"></p>
    </div>

    <main class="account-options">
      <section class="account-card">
        <h2>Google</h2>
        <form class="account-form" action="#" method="post">
          <label for="google-email">Email ID
            <input id="google-email" name="email" type="email" autocomplete="email" required>
          </label>
          <label for="google-password">Password
            <input id="google-password" name="password" type="password" autocomplete="current-password" required>
          </label>
          <label for="google-display-name">Display name
            <input id="google-display-name" name="displayName" type="text" autocomplete="name" required>
          </label>
          <button type="submit">Continue with Google</button>
          <p class="form-status" aria-live="polite"></p>
        </form>
      </section>

      <section class="account-card">
        <h2>Microsoft</h2>
        <form class="account-form" action="#" method="post">
          <label for="microsoft-email">Email ID
            <input id="microsoft-email" name="email" type="email" autocomplete="email" required>
          </label>
          <label for="microsoft-password">Password
            <input id="microsoft-password" name="password" type="password" autocomplete="current-password" required>
          </label>
          <label for="microsoft-display-name">Display name
            <input id="microsoft-display-name" name="displayName" type="text" autocomplete="name" required>
          </label>
          <button type="submit">Continue with Microsoft</button>
          <p class="form-status" aria-live="polite"></p>
        </form>
      </section>
    </main>

    <section class="achievements" aria-labelledby="achievements-title">
      <h2 id="achievements-title">Achievements</h2>
      <div id="achievement-list" class="achievement-list"></div>
      <p id="no-achievements" class="no-achievements">Complete goals to earn badges.</p>
    </section>
  </div>

  <!-- JavaScript functionality for LocalStorage & Achievements -->
  <script>
    const accountStorageKey = 'nadfi-accounts';
    const accountForms = document.querySelectorAll('.account-form');
    const logoutButton = document.getElementById('logout-button');
    const logoutStatus = document.querySelector('.logout-status');
    const goalStorageKey = 'nadfi-goals';
    const achievementList = document.getElementById('achievement-list');
    const noAchievements = document.getElementById('no-achievements');

    function loadAccounts() {
      const savedAccounts = JSON.parse(localStorage.getItem(accountStorageKey) || '{}');

      accountForms.forEach((form) => {
        const account = savedAccounts[form.closest('.account-card').querySelector('h2').textContent.toLowerCase()];

        if (!account) {
          return;
        }

        form.elements.email.value = account.email || '';
        form.elements.password.value = account.password || '';
        form.elements.displayName.value = account.displayName || '';
      });
    }

    accountForms.forEach((form) => form.addEventListener('submit', (event) => {
      event.preventDefault();
      const provider = form.closest('.account-card').querySelector('h2').textContent.toLowerCase();
      const savedAccounts = JSON.parse(localStorage.getItem(accountStorageKey) || '{}');

      savedAccounts[provider] = {
        email: form.elements.email.value,
        password: form.elements.password.value,
        displayName: form.elements.displayName.value
      };
      localStorage.setItem(accountStorageKey, JSON.stringify(savedAccounts));
      form.querySelector('.form-status').textContent = 'Saved';
    }));

    logoutButton.addEventListener('click', () => {
      localStorage.removeItem(accountStorageKey);
      accountForms.forEach((form) => {
        form.reset();
        form.querySelector('.form-status').textContent = '';
      });
      logoutStatus.textContent = 'Logged out';
    });

    function monthDifference(startMonth, endMonth) {
      const [startYear, startNumber] = startMonth.split('-').map(Number);
      const [endYear, endNumber] = endMonth.split('-').map(Number);
      return (endYear - startYear) * 12 + endNumber - startNumber;
    }

    function addAchievement(label, type) {
      const badge = document.createElement('span');
      badge.className = `achievement-badge ${type}`;
      badge.innerHTML = `<img src="Screenshot 2026-08-20 084859.png" alt="${label} badge picture"><span>${label}</span>`;
      achievementList.appendChild(badge);
    }

    function loadAchievements() {
      let progress;

      try {
        progress = JSON.parse(localStorage.getItem(goalStorageKey) || 'null') || {};
      } catch (error) {
        progress = {};
      }

      const completedDays = Array.isArray(progress.completedDates) ? progress.completedDates.length : 0;
      const startingMonth = progress.startingMonth || progress.completedDates?.[0]?.slice(0, 7);
      const currentMonth = new Date().toLocaleDateString('en-CA').slice(0, 7);

      for (let day = 1; day <= completedDays; day++) {
        addAchievement(`STARTER${day}`, 'starter');
      }
      if (Array.isArray(progress.bronzeWeeks)) {
        progress.bronzeWeeks.forEach((week, index) => {
          addAchievement(`BRONZE${index + 1}`, 'bronze');
        });
      }
      if (startingMonth && Array.isArray(progress.silverMonths)) {
        progress.silverMonths.forEach((month, index) => {
          const monthNumber = monthDifference(startingMonth, month);

          if (monthNumber > 0 && month <= currentMonth) {
            addAchievement(`SILVER${index + 1}`, 'silver');
          }
        });
      }
      if (Array.isArray(progress.goldYears)) {
        progress.goldYears.forEach((year, index) => {
          if (String(year) <= currentMonth.slice(0, 4)) {
            addAchievement(`GOLD${index + 1}`, 'gold');
          }
        });
      }

      noAchievements.hidden = achievementList.children.length > 0;
    }

    loadAccounts();
    loadAchievements();
  </script>
</body>
    </html>
