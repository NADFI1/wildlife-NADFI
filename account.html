<html lang="en">
<head>
  <meta charset="UTF-8">

  <!-- Favicon / Logo -->
  <link rel="icon" type="image/png" href="Logo.png">

  <!-- External Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Hidden Control Checkbox for Mobile Drawer Toggle -->
  <input type="checkbox" id="nav-toggle" class="nav-toggle">

  <!-- Mobile Sticky Header Bar -->
  <div class="mobile-header">
    <a href="index.html">
      <img src="IMG-20260917-WA0003.jpg" alt="NADFI Logo" class="site-logo">
    </a>
    <label for="nav-toggle" class="hamburger-btn">&#9776;</label>
  </div>

  <!-- Mobile Slide-Out Side Drawer Menu -->
  <div class="side-nav">
    <label for="nav-toggle" class="close-btn">&times;</label>
    <a href="index.html">Home</a>
    <a href="about.html">About Us</a>
    <a href="account.html">Account</a>
    <a href="decisions.html">Decisions</a>
    <a href="fridaynews.html">Friday News</a>
    <a href="goals.html">Goals</a>
    <a href="project1.html">Project 1</a>
  </div>

  <!-- Mobile Background Overlay for Menu -->
  <label for="nav-toggle" class="sidebar-overlay"></label>

  <!-- Desktop Top Navigation Bar -->
  <nav class="desktop-nav">
    <a href="index.html">
      <img src="IMG-20260917-WA0003.jpg" alt="NADFI Logo" class="site-logo">
    </a>
    <a href="index.html">Home</a>
    <a href="about.html">About Us</a>
    <a href="account.html">Account</a>
    <a href="decisions.html">Decisions</a>
    <a href="fridaynews.html">Friday News</a>
    <a href="goals.html">Goals</a>
    <a href="project1.html">Project 1</a>
  </nav>

  <!-- Main Content Area -->
  <div class="content">
    <div class="brand-header">
      <img src="IMG-20260917-WA0003.jpg" alt="NADFI Logo" class="account-logo">
      <h1>NADFI</h1>
    </div>

    <h2>Protecting Nature, Life and Building Hopes.</h2>
    <p>Choose an account provider and enter your details.</p>

    <div class="account-actions">
      <button type="button" class="btn-logout">Log out</button>
    </div>

    <!-- Google Authentication Card -->
    <div class="auth-card">
      <h3>Google</h3>
      <form class="auth-form">
        <div class="form-group">
          <label for="google-email">Email ID</label>
          <input type="email" id="google-email" placeholder="Enter Google Email">
        </div>
        <div class="form-group">
          <label for="google-pass">Password</label>
          <input type="password" id="google-pass" placeholder="Enter Password">
        </div>
        <div class="form-group">
          <label for="google-name">Display name</label>
          <input type="text" id="google-name" placeholder="Enter Display Name">
        </div>
        <button type="submit" class="btn-submit">Continue with Google</button>
      </form>
    </div>

    <!-- Microsoft Authentication Card -->
    <div class="auth-card">
      <h3>Microsoft</h3>
      <form class="auth-form">
        <div class="form-group">
          <label for="ms-email">Email ID</label>
          <input type="email" id="ms-email" placeholder="Enter Microsoft Email">
        </div>
        <div class="form-group">
          <label for="ms-pass">Password</label>
          <input type="password" id="ms-pass" placeholder="Enter Password">
        </div>
        <div class="form-group">
          <label for="ms-name">Display name</label>
          <input type="text" id="ms-name" placeholder="Enter Display Name">
        </div>
        <button type="submit" class="btn-submit">Continue with Microsoft</button>
      </form>
    </div>
  </div>

</body>
</html>
